
name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/asistencias-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          # El Frontend sí suele necesitar la URL de la API en tiempo de construcción (build-time)
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/asistencias-frontend:latest

      - name: Trigger Dokploy Backend Webhook
        run: |
          curl -X POST "${{ secrets.DOKPLOY_ASISTENCIAS_BACK }}" \
            -H "Content-Type: application/json" \
            -d '{"commit": "${{ github.sha }}", "image": "${{ secrets.DOCKERHUB_USERNAME }}/asistencias-backend:latest", "token": "${{ secrets.DOCKERHUB_TOKEN }}"}'
        if: always()

      - name: Trigger Dokploy Frontend Webhook
        run: |
          curl -X POST "${{ secrets.DOKPLOY_ASISTENCIAS_FRONT }}" \
            -H "Content-Type: application/json" \
            -d '{"commit": "${{ github.sha }}", "image": "${{ secrets.DOCKERHUB_USERNAME }}/asistencias-frontend:latest", "token": "${{ secrets.DOCKERHUB_TOKEN }}"}'
        if: always()